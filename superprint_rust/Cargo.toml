# Espace de travail Rust de SuperPrint.
#
# Feuille de route : docs/PLAN.md. Quatre crates. Les trois premiers sont purs
# Rust et **sans aucune dépendance externe** ; le quatrième est la frontière C.
#
#   superprint-core   primitives pures (unités, couleurs, géométrie, color8)
#   superprint-image  traitement d'image (réduction, DPI, RunLength) — module 4
#   superprint-pdf    tons directs & écriture PDF (image comprise)   — module 3
#   superprint-wasm   frontière C, SEUL crate en `cdylib` : il produit le
#                     `dist/superprint_core.wasm` chargeable par un navigateur
#
# Les trois premiers portent `#![forbid(unsafe_code)]` : tout l'`unsafe` de la
# frontière est concentré dans `superprint-wasm`.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
authors = ["Simon Dupont-Gellert (Zigmoon)"]
repository = "https://github.com/zigmoon/SUPERPRINT"

# Profil de publication pensé pour la taille du WASM (chargement navigateur).
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
