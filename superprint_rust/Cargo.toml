# Espace de travail Rust de SuperPrint.
#
# Feuille de route : docs/PLAN.md. Cinq crates. Les quatre premiers sont purs
# Rust et **sans aucune dépendance externe** ; le dernier est la frontière C.
#
#   superprint-core   primitives pures (unités, couleurs, géométrie, color8)
#   superprint-image  traitement d'image (réduction, DPI, RunLength) — module 4
#   superprint-font   analyse de police TrueType (cmap, métriques)  — module 6
#   superprint-pdf    tons directs & exporteur de PDF (texte compris) — module 3
#   superprint-wasm   frontière C, SEUL crate en `cdylib` : il produit le
#                     `dist/superprint_core.wasm` chargeable par un navigateur
#
# Les quatre premiers portent `#![forbid(unsafe_code)]` : tout l'`unsafe` de la
# frontière est concentré dans `superprint-wasm`.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
# Licence **propriétaire**. `LicenseRef-Proprietary` est la façon SPDX de nommer
# une licence qui n'est pas dans la liste standard ; c'est exactement notre cas,
# et écrire un identifiant SPDX standard ici (AGPL-3.0-or-later, par exemple)
# serait un mensonge lisible par n'importe quel outil d'audit.
#
# Le texte est dans `LICENSE`, à côté de ce fichier. Les dix-huit crates en
# héritent par `license.workspace = true` : une seule déclaration, donc aucune
# copie ne peut diverger.
license = "LicenseRef-Proprietary"
authors = ["Simon Dupont-Gellert (Zigmoon)"]
repository = "https://github.com/zigmoon/SUPERPRINT"

# Profil de publication pensé pour la taille du WASM (chargement navigateur).
[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
