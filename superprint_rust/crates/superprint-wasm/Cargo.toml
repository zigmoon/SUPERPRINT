[package]
name = "superprint-wasm"
description = "Surface C du noyau Rust de SuperPrint, compilée en WebAssembly pour le navigateur (cdylib, sans wasm-bindgen)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Le SEUL crate du workspace produit en `cdylib` (donc en `.wasm` chargeable par
# un navigateur) en plus du `rlib`. Les trois crates du noyau restent des
# bibliothèques Rust pures : c'est ici, et uniquement ici, que se trouve le
# `unsafe` de la frontière C.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
superprint-core = { path = "../superprint-core" }
superprint-compress = { path = "../superprint-compress" }
superprint-font = { path = "../superprint-font" }
superprint-image = { path = "../superprint-image" }
superprint-impose = { path = "../superprint-impose" }
superprint-pdf = { path = "../superprint-pdf" }
superprint-text = { path = "../superprint-text" }
