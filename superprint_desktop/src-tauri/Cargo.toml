[package]
name = "superprint-desktop"
version = "1.7.701"
description = "SuperPrint — PAO dans le navigateur, en application de bureau"
authors = ["Simon Dupont-Gellert (Zigmoon) <contact@superprint.cc>"]
edition = "2021"
# Plancher relevé de 1.77 à 1.90 : `tauri-plugin-updater` 2 déclare 1.90 comme
# version minimale de Rust. La déclarer ici évite un message d'erreur obscur au
# moment de la résolution des dépendances.
rust-version = "1.90"
license = "LicenseRef-Proprietary"
repository = "https://github.com/zigmoon/SUPERPRINT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mise à jour automatique (voir src/maj.rs).
# `tauri-plugin-updater` exige Rust 1.90 : c'est lui qui fixe le plancher de
# `rust-version` ci-dessus, et non l'inverse.
tauri-plugin-updater = "2"

# Le dialogue natif de proposition d'installation. Il n'est utilisé que par
# `maj.rs`, côté Rust : aucune permission n'est donc ouverte à la page web.
tauri-plugin-dialog = "2"

# Le binaire distribué : petit, sans symboles, sans code mort de debug.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
