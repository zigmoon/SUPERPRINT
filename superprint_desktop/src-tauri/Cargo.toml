[package]
name = "superprint-desktop"
version = "1.7.627"
description = "SuperPrint — PAO dans le navigateur, en application de bureau"
authors = ["Simon Dupont-Gellert (Zigmoon) <contact@superprint.cc>"]
edition = "2021"
rust-version = "1.77"
license = "LicenseRef-Proprietary"
repository = "https://github.com/zigmoon/SUPERPRINT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Le binaire distribué : petit, sans symboles, sans code mort de debug.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
