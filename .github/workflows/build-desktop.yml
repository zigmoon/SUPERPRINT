# ══════════════════════════════════════════════════════════════════════════════
#  APPLICATIONS DE BUREAU — SuperPrint · Studio IA · SuperTyPo
#
#  Trois applications, quatre tâches système : ce workflow produit NEUF
#  installeurs principaux, plus les formats secondaires que chaque système sait
#  faire en plus.
#
#  POURQUOI UNE MATRICE APPLICATION × SYSTÈME.
#  `superprint_desktop/` est UN SEUL projet Tauri, compilé trois fois avec trois
#  surcouches de configuration (`src-tauri/apps/<app>.json`). Ce n'est pas un
#  détail d'élégance : la coquille native est identique — une fenêtre, une
#  webview — et seule change la page qu'elle ouvre. Trois projets séparés
#  auraient triplé le code à maintenir sans rien apporter.
#
#  CE QUE CHAQUE APPLICATION EMBARQUE : TOUT CE QU'UN DE SES BOUTONS OUVRE.
#  `scripts/prepare-bundle.mjs` fabrique trois dossiers distincts :
#    · SuperPrint — 62,5 Mo : l'éditeur, plus le Studio IA et SuperTyPo ;
#    · Studio IA   — 61,7 Mo : le studio, plus l'éditeur ;
#    · SuperTyPo   —  1,0 Mo : entièrement autonome, il n'ouvre rien d'autre.
#
#  LES TROIS APPLICATIONS SE PARLENT, et le paquet doit suivre : le Studio a un
#  bouton ÉDITER qui ouvre l'éditeur, l'éditeur a deux portes vers le studio et
#  vers SuperTyPo. Un paquet qui ne contiendrait qu'une application n'est pas plus
#  léger, il est cassé — le bouton ouvre une page absente. La règle est donc : on
#  liste les liens sortants AVANT de composer, et chaque cible entre dans le
#  paquet.
#
#  LE POIDS EST LE PRIX DE CETTE RÈGLE, et il est assumé. Les polices ne sont pas
#  recopiées pour autant : celles de `app/` sont réutilisées par un chemin relatif,
#  ce qui économise 19 Mo par paquet.
#
#  RIEN N'EST JETÉ. `bundle.targets` vaut « all », donc Tauri livre, pour chaque
#  système, tous les formats qu'il sait faire : Windows → NSIS **et** MSI,
#  Linux → `.deb`, `.rpm` **et** `.AppImage`, macOS → `.app` puis `.dmg`. Le
#  `.msi` sert le déploiement en parc (GPO, SCCM), le `.rpm` les systèmes
#  Fedora / RHEL / openSUSE, auxquels l'AppImage n'offre aucune intégration.
#
#  POURQUOI DES NOMS FIXES. Les fichiers produits par Tauri portent la version
#  (« SuperPrint_1.7.614_x64-setup.exe »). Un lien de la page de présentation ne
#  peut pas suivre un nom qui change à chaque livraison : on renomme donc les
#  artefacts avant publication, et les adresses restent stables.
#
#  DEUX PUBLICATIONS, ET POURQUOI. Ces noms fixes sont attachés à la version
#  `desktop-latest`, qui écrase ses fichiers à chaque passage : c'est ce qui
#  garde les liens du site vivants. Une seconde release, portant le tag de la
#  version, fige les mêmes fichiers — sans elle, l'installeur de la veille ne
#  serait plus téléchargeable nulle part dès la livraison suivante. D'où la
#  dernière étape du job « publier ».
#
#  ⚠️ Ces adresses ne répondent qu'APRÈS le premier passage de ce workflow.
# ══════════════════════════════════════════════════════════════════════════════
name: Applications de bureau

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.app }} · ${{ matrix.systeme }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # ⚠️ LES DOUZE COMBINAISONS SONT ÉCRITES EN CLAIR, ET CE N'EST PAS DU VERBE.
      #
      # Le premier jet croisait `app: [superprint, studio, supertypo]` avec une
      # liste `include` de quatre systèmes. GitHub a produit **trois tâches, toutes
      # Linux** : quand plusieurs entrées d'`include` ne partagent AUCUNE clé avec
      # la matrice de base, elles sont fusionnées en un seul objet — et seul le
      # dernier survit (`systeme: Linux`, `platform: ubuntu-22.04`, `target: ''`).
      # L'intention « 3 × 4 = 12 » n'était donc pas celle du moteur.
      #
      # Mesuré sur le run #3 : `total_count: 3`, trois tâches `ubuntu-22.04`. Le
      # job de publication a ensuite échoué, comme il doit le faire quand un
      # paquet manque — mais c'est une heure de calcul perdue, et cela ne se voit
      # qu'en lisant les tâches créées.
      #
      # Écrit ainsi, il n'y a plus d'interprétation possible.
      #
      # Le nom d'artefact ne doit pas contenir d'espace : « macOS-ARM » et non
      # « macOS Apple Silicon ».
      matrix:
        include:
          - { app: superprint, systeme: Windows,     platform: windows-latest, target: '' }
          - { app: superprint, systeme: macOS-ARM,   platform: macos-latest,   target: aarch64-apple-darwin }
          - { app: superprint, systeme: macOS-Intel, platform: macos-latest,   target: x86_64-apple-darwin }
          - { app: superprint, systeme: Linux,       platform: ubuntu-22.04,   target: '' }

          - { app: studio,     systeme: Windows,     platform: windows-latest, target: '' }
          - { app: studio,     systeme: macOS-ARM,   platform: macos-latest,   target: aarch64-apple-darwin }
          - { app: studio,     systeme: macOS-Intel, platform: macos-latest,   target: x86_64-apple-darwin }
          - { app: studio,     systeme: Linux,       platform: ubuntu-22.04,   target: '' }

          - { app: supertypo,  systeme: Windows,     platform: windows-latest, target: '' }
          - { app: supertypo,  systeme: macOS-ARM,   platform: macos-latest,   target: aarch64-apple-darwin }
          - { app: supertypo,  systeme: macOS-Intel, platform: macos-latest,   target: x86_64-apple-darwin }
          - { app: supertypo,  systeme: Linux,       platform: ubuntu-22.04,   target: '' }

    steps:
      - uses: actions/checkout@v5

      # WebKitGTK : la webview du système sous Linux. Rien de tel n'existe sous
      # Windows (WebView2) ni sous macOS (WKWebView), où le système fournit tout.
      # `rpm` sert à construire le paquet RPM — il n'est pas installé d'origine.
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # Node 24 : c'est le LTS en cours. Node 20, qu'on installait avant, est
      # sorti du support — et GitHub le déprécie aussi pour le moteur des
      # actions elles-mêmes.
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          # Le cache est partagé par les trois applications : même projet Cargo,
          # seule la configuration d'empaquetage change. La clé doit donc ignorer
          # `matrix.app`, sinon chaque application recompilerait 100 % de ses
          # dépendances depuis zéro.
          key: ${{ matrix.platform }}-${{ matrix.target }}
          workspaces: superprint_desktop/src-tauri -> target

      - name: CLI Tauri
        working-directory: superprint_desktop
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # L'assemblage de la bonne application est le travail de
      # `beforeBuildCommand`, déclaré dans chaque surcouche — il s'exécute donc
      # ici, et il refuse de compiler si une surcouche ne désigne pas la même
      # application que son `frontendDist` (voir scripts/prepare-bundle.mjs).
      #
      # `tauri-action` sans tagName ni releaseName : il compile et s'arrête là.
      # La publication est le travail du job « publier », plus bas.
      - name: Compiler
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: superprint_desktop
          args: >-
            --config src-tauri/apps/${{ matrix.app }}.json
            ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # ── macOS : poser le désinstalleur DANS l'image disque ──────────────────
      #
      # ⚠️ POURQUOI UNE ÉTAPE SÉPARÉE, ET PAS DE LA CONFIGURATION. Le `.dmg` ne
      # peut pas recevoir de fichier par configuration : le schéma de Tauri
      # n'accepte, pour le DMG, que des clés de MISE EN PAGE (fond, taille et
      # position de la fenêtre, position des icônes) — vérifié sur le schéma de
      # @tauri-apps/cli 2.12.2. Le seul moyen d'y poser un fichier est donc de
      # ROUVRIR l'image après sa création.
      #
      # ⚠️ CETTE ÉTAPE NE DOIT JAMAIS FAIRE ÉCHOUER LA COMPILATION. Une image
      # disque ratee vaut mieux qu'une livraison sans macOS du tout. On
      # reconstruit une image, on la REMONTE pour vérifier qu'elle contient
      # toujours l'application ET le script, et on ne remplace l'original que si
      # les deux sont là. Sinon l'image d'origine est conservée intacte.
      - name: macOS — désinstalleur dans l'image disque
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: superprint_desktop
        run: |
          set -u
          nom="$(node -p "require('./src-tauri/apps/${{ matrix.app }}.json').productName")"
          source="src-tauri/desinstaller-macos-${{ matrix.app }}.command"
          if [ ! -f "$source" ]; then
            echo "::warning::$source absent — image disque laissée telle quelle."
            exit 0
          fi

          trouve=0
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/dmg/*.dmg; do
            [ -f "$dmg" ] || continue
            trouve=1
            travail="$(mktemp -d)"
            rw="$travail/rw.dmg"
            mnt="$travail/mnt"
            neuf="$travail/neuf.dmg"
            mkdir -p "$mnt"

            if ! hdiutil convert "$dmg" -format UDRW -o "$rw" >/dev/null 2>&1; then
              echo "::warning::conversion de $dmg impossible — image laissée telle quelle."
              rm -rf "$travail"; continue
            fi
            if ! hdiutil attach "$rw" -mountpoint "$mnt" -nobrowse -quiet; then
              echo "::warning::montage de $dmg impossible — image laissée telle quelle."
              rm -rf "$travail"; continue
            fi

            cp "$source" "$mnt/Désinstaller $nom.command"
            chmod +x "$mnt/Désinstaller $nom.command"
            hdiutil detach "$mnt" -quiet || true

            if ! hdiutil convert "$rw" -format UDZO -imagekey zlib-level=9 -o "$neuf" >/dev/null 2>&1; then
              echo "::warning::recompression de $dmg impossible — image laissée telle quelle."
              rm -rf "$travail"; continue
            fi

            # CONTRÔLE : on remonte l'image produite et on exige les DEUX entrées.
            controle="$(mktemp -d)"
            ok=0
            if hdiutil attach "$neuf" -mountpoint "$controle" -nobrowse -quiet; then
              if [ -d "$controle/$nom.app" ] && [ -f "$controle/Désinstaller $nom.command" ]; then ok=1; fi
              hdiutil detach "$controle" -quiet || true
            fi
            rmdir "$controle" 2>/dev/null || true

            if [ "$ok" -eq 1 ]; then
              mv "$neuf" "$dmg"
              echo "$dmg : « Désinstaller $nom.command » ajouté ($(stat -f%z "$dmg") octets)."
            else
              echo "::warning::$dmg : le contrôle a échoué — image ORIGINALE conservée."
            fi
            rm -rf "$travail"
          done
          [ "$trouve" -eq 1 ] || echo "::warning::aucune image disque trouvée."

      - name: Téléverser les paquets
        uses: actions/upload-artifact@v6
        with:
          name: paquets-${{ matrix.app }}-${{ matrix.systeme }}
          path: superprint_desktop/src-tauri/target/**/bundle/**
          if-no-files-found: error

  publier:
    name: Publier (noms stables)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Node : la version de l'application est lue dans `tauri.conf.json` par
      # `node -p`, pour être comparée au tag. L'image du runner en embarque un,
      # mais rien ne garantit lequel ni jusqu'à quand — la version est donc
      # déclarée ici, comme dans le job de compilation.
      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # On NE fusionne PAS les téléversements dans un seul dossier : chaque
      # application est déjà rangée dans le sien, et c'est ce dossier qui permet
      # de savoir à quelle application appartient un fichier. Tauri nomme les
      # installeurs d'après le `productName`, et deux applications différentes
      # peuvent produire des noms qui se ressemblent beaucoup.
      - name: Récupérer tous les paquets
        uses: actions/download-artifact@v7
        with:
          path: paquets

      # Le renommage est la raison d'être de ce job : il transforme des noms
      # versionnés en adresses stables, et échoue BRUYAMMENT si un paquet
      # manque — un lien mort sur la page de présentation serait pire que pas de
      # lien du tout.
      #
      # `find paquets -path "*$app*"` restreint la recherche au dossier de
      # l'application. Le motif est sensible à la casse, et les dossiers portent
      # le nom technique de l'application (`paquets-studio-...`), jamais le nom
      # affiché : « Studio » ne peut donc pas être attrapé par le motif des deux
      # autres.
      - name: Normaliser les noms
        run: |
          set -eu
          out=livraison
          mkdir -p "$out"

          copier() {  # application  motif_source  nom_stable
            trouve=$(find paquets -path "*$1*" -iname "$2" -type f | head -n 1 || true)
            if [ -z "$trouve" ]; then
              echo "MANQUANT : $1 / $2" >&2
              exit 1
            fi
            cp "$trouve" "$out/$3"
            printf '%-11s %-24s -> %s\n' "$1" "$2" "$3"
          }

          for app in superprint studio supertypo; do
            case "$app" in
              superprint) nom='SuperPrint' ;;
              studio)     nom='Studio-IA' ;;
              supertypo)  nom='SuperTyPo' ;;
            esac

            copier "$app" '*_x64-setup.exe'   "$nom-Windows-x64-setup.exe"
            copier "$app" '*_x64_en-US.msi'   "$nom-Windows-x64.msi"
            copier "$app" '*_aarch64.dmg'     "$nom-macOS-AppleSilicon.dmg"
            copier "$app" '*_x64.dmg'         "$nom-macOS-Intel.dmg"
            copier "$app" '*_amd64.AppImage'  "$nom-Linux-x86_64.AppImage"
            copier "$app" '*_amd64.deb'       "$nom-Linux-x86_64.deb"
            copier "$app" '*.x86_64.rpm'      "$nom-Linux-x86_64.rpm"
          done

          echo
          ls -lh "$out"

      - name: Publier la version « desktop-latest »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(tr -d ' \r\n' < superprint/version.txt)"

          # ── LE TEXTE DE LA PAGE VIT DANS UN FICHIER, PAS DANS CE YAML ────────
          # `.github/release-notes-desktop-latest.md` est la SEULE source du titre
          # et du texte : bilingue (anglais puis francais), avec la version, les
          # liens du site et l'adresse de contact. Le workflow « Page de version
          # GitHub » relit le meme fichier pour rafraichir la page sans rien
          # reconstruire — deux copies divergeraient, donc il n'y en a qu'une.
          sed "s/@VERSION@/$version/g" .github/release-notes-desktop-latest.md > notes-desktop-latest.md
          if grep -q '@VERSION@' notes-desktop-latest.md; then
            echo "::error::un @VERSION@ subsiste dans le texte de la page"
            exit 1
          fi

          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest --latest=false

          # ⚠️ L'ÉDITION EST INCONDITIONNELLE, ET C'EST LA CORRECTION DU JOUR.
          # `gh release view ... || gh release create ... --notes ...` ne pose le
          # texte qu'UNE fois : la page du 15 octobre portait donc encore le texte
          # écrit à sa création, le 13 — une phrase française, sans version, sans
          # lien, sans contact. Un texte de page est une donnée VIVANTE : il se
          # réécrit à chaque passage.
          gh release edit desktop-latest \
            --title "SuperPrint $version — desktop applications / applications de bureau" \
            --notes-file notes-desktop-latest.md

          gh release upload desktop-latest livraison/* --clobber

      # ── ARCHIVE VERSIONNÉE ──────────────────────────────────────────────────
      #
      # Ce que `desktop-latest` ne peut PAS conserver. Il porte des noms fixes
      # et se fait écraser à chaque passage (`--clobber`) : c'est exactement ce
      # qu'il faut pour les liens du site, mais l'installeur publié la veille
      # disparaît le lendemain — il n'existe alors plus nulle part, et le tag du
      # dépôt ne garde que le code source, pas les binaires.
      #
      # Cette seconde publication fige donc les mêmes fichiers sous une release
      # portant le tag de la version, que rien ne réécrit.
      #
      # L'ORDRE COMPTE : cette étape vient APRÈS `desktop-latest`, parce que
      # c'est `desktop-latest` qui alimente les téléchargements du site. Une
      # archive est un supplément : elle ne doit jamais pouvoir retarder ni
      # empêcher la mise à jour des liens. Pour la même raison, elle avertit et
      # s'abstient plutôt que d'échouer.
      #
      # DEUX CONTRÔLES AVANT DE FIGER QUOI QUE CE SOIT, parce qu'une release
      # versionnée est une affirmation : « ces binaires SONT la version 1.7.614 ».
      #   1. Le workflow doit être parti DU TAG. `workflow_dispatch` sait partir
      #      d'une branche : les binaires viendraient alors d'un commit que le
      #      tag ne désigne pas, et l'affirmation serait fausse.
      #   2. Le tag doit dire la même chose que l'application compilée. Rien
      #      n'empêche de poser un tag `desktop-v1.7.999` sur un build 1.7.614.
      #
      # `SHA256SUMS` ne va QUE dans l'archive : une empreinte n'a de sens que
      # pour un fichier qui ne bougera plus.
      - name: Publier l'archive versionnée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          case "${GITHUB_REF:-}" in
            refs/tags/desktop-v*) tag="${GITHUB_REF_NAME}" ;;
            *)
              echo "::warning::construit depuis ${GITHUB_REF:-?}, pas depuis un tag : archive versionnee ignoree"
              exit 0
              ;;
          esac
          version="${tag#desktop-v}"

          declaree=$(node -p "require('./superprint_desktop/src-tauri/tauri.conf.json').version")
          if [ "$version" != "$declaree" ]; then
            echo "::warning::le tag $tag annonce $version, l'application compilee est $declaree : archive versionnee ignoree"
            exit 0
          fi

          ( cd livraison && sha256sum * > ../SHA256SUMS )
          cat SHA256SUMS

          # ⚠️ Le texte de l'archive vit dans un fichier, LUI AUSSI. Écrit dans ce
          # YAML, il contenait des « deux-points espace » sur une ligne de
          # continuation — et l'analyseur YAML refuse ça (« mapping values are not
          # allowed here »), ce qui aurait rendu le workflow entier illisible.
          sed "s/@VERSION@/$version/g" .github/release-notes-archive.md > notes-archive.md
          if grep -q '@VERSION@' notes-archive.md; then
            echo "::error::un @VERSION@ subsiste dans le texte de l'archive"
            exit 1
          fi

          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "SuperPrint $version — desktop applications / applications de bureau" \
              --notes-file notes-archive.md \
              --latest=false
          gh release upload "$tag" livraison/* SHA256SUMS --clobber
          echo "archive $tag publiee"

      # ── ANCRAGE DU BADGE « LATEST » ─────────────────────────────────────────
      #
      # MESURE, pas precaution : sur la 1.7.614, `gh release create --latest=false`
      # n'a PAS suffi — GitHub a quand meme affiche la release archivee comme
      # « Latest », parce qu'elle est la plus recente. Le badge ne se retire pas,
      # il se designe : il faut nommer explicitement celle qui le garde.
      #
      # C'est `desktop-latest` qui doit le porter : c'est elle que le site
      # presente comme porte d'entree, ses 21 noms fixes etant ceux des liens
      # de telechargement. L'etape vient donc EN DERNIER, apres la creation de
      # l'archive, et elle s'execute meme quand celle-ci s'est abstenue.
      - name: Ancrer « Latest » sur desktop-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release edit desktop-latest --latest
          echo "badge Latest : desktop-latest"

